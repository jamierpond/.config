name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Flake check + Linux home-manager build (just ci)
  check:
    name: Flake Check and Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: just ci
        run: nix run nixpkgs#just -- ci

  # Build macOS config (optional - runs on macos runner)
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build darwin config
        run: nix build .#darwinConfigurations.tamby.system

  # Docker test (full integration)
  docker:
    name: Docker Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in Docker
        run: docker build -t dotfiles-test .

      - name: Run container
        run: docker run --rm dotfiles-test
